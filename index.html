<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RU Laundry System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= HEADER (shared) ================= -->
  <header class="site-header">
    <div class="header-inner">
      <button id="menuBtn" class="menu-btn hidden" aria-label="Open menu">&#9776;</button>
      <img class="logo" src="logo.png" alt="Rishihood University">
      <span id="headerText" class="header-text">Rishihood University, Sonipat</span>

      <div id="headerTools" class="header-tools hidden">
        <button id="bellBtn" class="bell" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>
          <span id="bellCount" class="bell-count hidden">0</span>
        </button>
        <div class="profile-wrap">
          <button id="profileBtn" class="avatar" aria-label="Profile menu"><span id="avatarLetter">R</span></button>
          <div id="profileMenu" class="menu hidden">
            <p id="profileName" class="menu-name"></p>
            <p id="profileSub" class="muted small"></p>
            <button id="logoutBtn" class="btn btn-outline btn-small">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= PUBLIC AREA: landing + login ================= -->
  <main id="publicArea">

    <section id="landing" class="container">
      <h1 class="hero-title">RU Laundry System</h1>
      <p class="hero-sub">Manage your laundry in one place. Choose the area you want to sign in to.</p>

      <div class="portal-grid">
        <button class="portal-card" data-role="student">
          <span class="icon-tile"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/></svg></span>
          <h2>Student Portal</h2>
          <p>Give clothes, collect your bag, and track your laundry.</p>
          <span class="signin">Sign in &rarr;</span>
        </button>
        <button class="portal-card" data-role="worker">
          <span class="icon-tile"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg></span>
          <h2>Worker Application</h2>
          <p>Scan QR codes, verify bags and hand them back.</p>
          <span class="signin">Sign in &rarr;</span>
        </button>
        <button class="portal-card" data-role="admin">
          <span class="icon-tile"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
          <h2>Admin Dashboard</h2>
          <p>Open the counter, manage bags and review everything.</p>
          <span class="signin">Sign in &rarr;</span>
        </button>
      </div>

      <div class="demo-note">
        <p>This app keeps all its data on the laundry server, in the PostgreSQL database. Sign in with one of the demo accounts below.</p>
        <div class="chip-row">
          <button class="chip" data-role="student">Student demo</button>
          <button class="chip" data-role="worker">Worker demo</button>
          <button class="chip" data-role="admin">Admin demo</button>
        </div>
      </div>
    </section>

    <section id="loginScreen" class="container hidden">
      <div class="login-wrap">
        <button id="backToPortals" class="link-back">&larr; All portals</button>
        <div class="card login-card">
          <h2 id="loginTitle">Student Login</h2>
          <p id="loginDesc" class="muted"></p>

          <label for="loginId" id="loginIdLabel">Student ID</label>
          <input id="loginId" class="input" type="text" autocomplete="username">

          <label for="loginPassword">Password</label>
          <div class="pw-wrap">
            <input id="loginPassword" class="input" type="password" placeholder="Enter your password" autocomplete="current-password">
            <button id="togglePw" type="button" class="pw-toggle">Show</button>
          </div>

          <p id="loginError" class="error" role="alert"></p>
          <button id="loginBtn" class="btn btn-block">Login</button>

          <div class="demo-box">
            <p class="muted small">Demo accounts (click to fill)</p>
            <div id="demoList"></div>
          </div>

          <p id="loginFooter" class="muted small center"></p>
          <p class="center"><button id="resetBtn" class="link-btn">Reset demo data</button></p>
        </div>
      </div>
    </section>

  </main>

  <!-- ================= APP AREA: student / worker / admin ================= -->
  <div id="appArea" class="hidden">
    <div class="app-layout">
      <aside id="sidebar" class="sidebar"></aside>

      <main class="content">
        <!-- student pages -->
        <section class="page hidden" id="page-s-dashboard"></section>
        <section class="page hidden" id="page-s-laundry"></section>
        <section class="page hidden" id="page-s-history"></section>
        <section class="page hidden" id="page-s-complaints"></section>
        <section class="page hidden" id="page-s-notifications"></section>
        <section class="page hidden" id="page-s-profile"></section>
        <!-- worker pages -->
        <section class="page hidden" id="page-w-dashboard"></section>
        <section class="page hidden" id="page-w-verify"></section>
        <section class="page hidden" id="page-w-mywork"></section>
        <section class="page hidden" id="page-w-requests"></section>
        <section class="page hidden" id="page-w-activity"></section>
        <!-- admin pages -->
        <section class="page hidden" id="page-a-dashboard"></section>
        <section class="page hidden" id="page-a-bags"></section>
        <section class="page hidden" id="page-a-students"></section>
        <section class="page hidden" id="page-a-history"></section>
        <section class="page hidden" id="page-a-complaints"></section>
      </main>
    </div>
  </div>

  <!-- Confirmation dialog -->
  <div id="dialogBox" class="modal hidden" role="dialog" aria-modal="true">
    <div class="card dialog-card">
      <h3 id="dialogTitle"></h3>
      <p id="dialogText"></p>
      <div class="dialog-buttons">
        <button id="dialogYes" class="btn">Confirm</button>
        <button id="dialogNo" class="btn btn-outline">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Small message at the bottom of the screen -->
  <div id="toast" class="toast hidden" role="status"></div>

  <!-- QR code library (needs internet; the code text is always shown as a backup) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Our code: order matters -->
  <script src="api.js"></script>
  <script src="main.js"></script>
  <script src="student.js"></script>
  <script src="staff.js"></script>
</body>
</html>
